name: Build and publish DroidHatch image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/droidhatch/redroid

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate image inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f image/Containerfile
          test -f image/bootstrap-layer.tar
          test -f image/kernel/vmlinux-arm64
          test -f image/prebuilt/gralloc.redroid.so
          test -f image/prebuilt/audio.primary.default.so
          test -f image/prebuilt/droidhatch-frame-agent
          test -f image/prebuilt/droidhatch-home.apk
          test -f image/init/droidhatch-input-audio.rc
          test -f image/init/droidhatch-home-setup.sh
          test -f image/init/droidhatch-home-setup.rc

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=stable
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: image
          file: image/Containerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
